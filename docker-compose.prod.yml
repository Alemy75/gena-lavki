services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/gena-lavki/.env}
      POSTGRES_DB: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/alemy75/gena-lavki:latest
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://catalog:${POSTGRES_PASSWORD}@db:5432/catalog?schema=public
    volumes:
      - catalog_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  catalog_uploads:
